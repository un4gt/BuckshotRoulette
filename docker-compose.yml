services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:///app/data/database.db
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
