[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
diesel = { version = "2", features = ["sqlite", "r2d2", "uuidv07", "chrono"] }
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
actix-web-httpauth = "0.8.2"
chrono = { version = "0.4.42", features = ["serde"] }
derive_more = "2.1.0"
